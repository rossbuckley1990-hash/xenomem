name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings (-O3 -Wall -Wextra)
        run: make
      - name: Enforce Zero PRNG / Zero /dev/urandom Imports in Binary
        run: |
          nm -u ./xenomem
          if nm -u ./xenomem | grep -E 'rand|random|getentropy|open'; then
            echo "Forbidden PRNG or entropy file symbol detected!"
            exit 1
          fi
      - name: Execute 64GB Observer-Collapse & Vacuum Decay Proof
        run: ./xenomem
