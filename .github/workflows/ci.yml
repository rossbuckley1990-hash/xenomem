name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile demo & 256GB torture suite (-O3 -Wall -Wextra)
        run: make
      - name: Enforce Zero PRNG / Zero /dev/urandom Imports in Binaries
        run: |
          nm -u ./xenomem ./xenomem_stress
          if nm -u ./xenomem ./xenomem_stress | grep -E 'rand|random|getentropy|open'; then
            echo "Forbidden PRNG or entropy file symbol detected!"
            exit 1
          fi
      - name: Execute 64GB Demo & Invariant Self-Audit
        run: ./xenomem
      - name: Execute 256GB / 16-Thread / 4,250-Clause Stress Suite
        run: ./xenomem_stress
